# Ruff configuration — linting for the Python backend.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled case-by-case
    "B008",  # FastAPI uses callables in argument defaults (Depends/File)
]

[lint.per-file-ignores]
"backend/tests/*" = ["E402"]   # imports after importorskip guards
"backend/main.py" = ["E402"]   # logging is configured before the pipeline modules import
