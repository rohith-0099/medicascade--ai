name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Lean dependency set: the pure-unit tests need only these. Tests that
      # require the full pipeline (pdfplumber, spaCy, torch …) skip themselves
      # via pytest.importorskip, keeping CI fast and deterministic.
      - name: Install dev tools
        run: pip install pytest httpx pydantic ruff

      - name: Lint (ruff)
        run: ruff check ..

      - name: Test (pytest)
        run: pytest

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
